---
# Illustrative names only. Set site-specific region, class, image, and storage values.
vcf_projects:
  - name: demo-project
    spec:
      description: Ansible-managed example project

vcf_vpcs:
  - name: demo-vpc
    namespace: demo-project
    spec:
      regionName: example-region
      vpcClassName: default

vcf_supervisor_namespaces:
  - name: demo-workloads
    namespace: demo-project
    spec:
      regionName: example-region
      className: small

vcf_virtual_machines:
  - name: demo-vm
    namespace: demo-workloads
    cloud_init: |
      #cloud-config
      users:
        - name: demo
          shell: /bin/bash
      runcmd:
        - [echo, "VCF Automation example is ready"]
    spec:
      className: best-effort-small
      imageName: example-linux-image
      storageClass: example-storage-policy

vcf_address_bindings:
  - name: demo-vm-public
    namespace: demo-workloads
    vpc_name: demo-vpc
    vm_name: demo-vm
