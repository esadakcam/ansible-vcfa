---
- name: Validate requested state and resources
  ansible.builtin.assert:
    that:
      - vcf_resource_state in ['present', 'absent']
      - item.name is defined
      - item.name | length > 0
      - item.namespace is defined
      - vcf_resource_state == 'absent' or item.spec is defined
      - vcf_resource_state == 'absent' or item.spec.regionName is defined
      - vcf_resource_state == 'absent' or item.spec.vpcClassName is defined
  loop: "{{ vcf_vpcs }}"
  loop_control:
    label: "{{ item.name | default('unnamed') }}"

- name: Manage VPCs
  kubernetes.core.k8s:
    state: "{{ vcf_resource_state }}"
    definition: "{{ lookup('ansible.builtin.template', 'manifest.yml.j2') | from_yaml }}"
    wait: true
  loop: "{{ vcf_vpcs }}"
  loop_control:
    label: "{{ item.namespace | default('cluster') }}/{{ item.name }}"
